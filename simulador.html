<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simulador · Inbox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#fff}
button{cursor:pointer;border:none;font-family:inherit}

/* ─── CHANNEL TOGGLE ─── */
.ch-toggle{display:flex;flex-shrink:0;background:#fff;border-bottom:1px solid #dbdbdb}
.ch-btn{flex:1;padding:13px 8px;font-size:13px;font-weight:600;color:#8e8e8e;background:transparent;border-bottom:2px solid transparent;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.ch-btn.ig.active{color:#e1306c;border-bottom-color:#e1306c}
.ch-btn.wa.active{color:#128c7e;border-bottom-color:#128c7e}

/* ─── IDENTITY BAR ─── */
.id-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fafafa;border-bottom:1px solid #dbdbdb;flex-shrink:0}
.id-bar input{flex:1;padding:9px 12px;border:1px solid #dbdbdb;border-radius:22px;font-size:14px;outline:none;background:#fff;font-family:inherit;min-width:0}
.id-bar input:focus{border-color:#a0a0a0}
.btn-start{padding:9px 16px;border-radius:22px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;transition:.15s}
.btn-start.ig{background:#e1306c}
.btn-start.wa{background:#128c7e}

/* ─── APP HEADER ─── */
.app-header{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0}
.app-header.ig{background:#262626}
.app-header.wa{background:#075e54}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.avatar.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border:2px solid transparent}
.avatar.wa{background:#25d366}
.hd-info{flex:1;min-width:0}
.hd-name{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-status{font-size:11px;color:rgba(255,255,255,.55)}
.hd-badge{font-size:10px;padding:3px 10px;border-radius:10px;font-weight:700;background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);flex-shrink:0}

/* ─── CHAT ─── */
.chat-wrap{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.chat-wrap.ig{background:#fff}
.chat-wrap.wa{background:#e5ddd5}
.msg{display:flex;flex-direction:column;max-width:74%;word-break:break-word}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.45}

/* IG bubbles */
.ig-chat .msg.me .bubble{background:linear-gradient(135deg,#833ab4,#e1306c);color:#fff;border-bottom-right-radius:4px}
.ig-chat .msg.them .bubble{background:#efefef;color:#000;border-bottom-left-radius:4px}

/* WA bubbles */
.wa-chat .msg.me .bubble{background:#dcf8c6;color:#000;border-bottom-right-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.wa-chat .msg.them .bubble{background:#fff;color:#000;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}

.msg-time{font-size:10px;color:#aaa;margin-top:2px;padding:0 3px}
.sys-line{text-align:center;font-size:11px;color:#999;margin:10px 0;padding:5px 14px;background:rgba(0,0,0,.05);border-radius:10px;align-self:center;max-width:80%}

/* ─── INPUT ─── */
.input-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;flex-shrink:0}
.input-bar.ig{background:#262626;border-top:1px solid #363636}
.input-bar.wa{background:#f0f0f0;border-top:1px solid #ddd}
.input-bar textarea{flex:1;border:1px solid transparent;border-radius:22px;padding:9px 14px;font-size:15px;font-family:inherit;resize:none;outline:none;line-height:1.4;max-height:90px;overflow-y:auto}
.input-bar.ig textarea{background:#363636;color:#fff}
.input-bar.ig textarea::placeholder{color:#666}
.input-bar.wa textarea{background:#fff;border-color:#ddd}
.btn-send{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;opacity:.35}
.btn-send.ig{background:#e1306c}
.btn-send.wa{background:#128c7e}
.btn-send.ready{opacity:1;transform:scale(1.05)}
</style>
</head>
<body>

<!-- Channel selector -->
<div class="ch-toggle" id="chToggle">
  <button class="ch-btn ig active" onclick="setChannel('ig')">📸 Instagram</button>
  <button class="ch-btn wa" onclick="setChannel('wa')">📱 WhatsApp</button>
</div>

<!-- Identity form -->
<div class="id-bar" id="idBar">
  <input id="inId" placeholder="@usuario_instagram" autocomplete="off" spellcheck="false">
  <input id="inName" placeholder="Nombre" style="max-width:110px">
  <button class="btn-start ig" id="btnStart" onclick="startChat()">Iniciar</button>
</div>

<!-- App header (hidden until connected) -->
<div class="app-header ig" id="appHeader" style="display:none">
  <div class="avatar ig" id="hAvatar">?</div>
  <div class="hd-info">
    <div class="hd-name" id="hName">—</div>
    <div class="hd-status" id="hStatus">Instagram DM</div>
  </div>
  <div class="hd-badge" id="hBadge">IG</div>
</div>

<!-- Chat area -->
<div class="chat-wrap ig ig-chat" id="chatArea">
  <div class="sys-line">Elegí el canal, completá los datos y tocá Iniciar</div>
</div>

<!-- Input -->
<div class="input-bar ig" id="inputBar">
  <textarea id="msgInput" placeholder="Mensaje..." rows="1"
    onkeydown="handleKey(event)" oninput="onInput(this)"></textarea>
  <button class="btn-send ig" id="btnSend" onclick="sendMsg()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
const bc = new BroadcastChannel('crm_inbox');
const $ = id => document.getElementById(id);

let channel = 'ig';
let connected = false;
let cId = '', cName = '';

function setChannel(c) {
  if (connected) return;
  channel = c;
  document.querySelectorAll('.ch-btn').forEach(b =>
    b.classList.toggle('active', b.classList.contains(c))
  );
  $('inId').placeholder = c === 'ig' ? '@usuario_instagram' : '+54 11 1234-5678';
  $('btnStart').className = `btn-start ${c}`;
  applyTheme(c);
}

function applyTheme(c) {
  $('appHeader').className = `app-header ${c}`;
  $('chatArea').className = `chat-wrap ${c} ${c}-chat`;
  $('inputBar').className = `input-bar ${c}`;
  $('btnSend').className = `btn-send ${c}`;
  $('hAvatar').className = `avatar ${c}`;
  $('hBadge').textContent = c === 'ig' ? 'IG' : 'WA';
}

function startChat() {
  const id = $('inId').value.trim();
  const name = $('inName').value.trim() || id;
  if (!id) { $('inId').focus(); return; }

  cId = id; cName = name; connected = true;
  $('idBar').style.display = 'none';
  $('chToggle').style.display = 'none';
  $('appHeader').style.display = 'flex';

  $('hAvatar').textContent = name.charAt(0).toUpperCase();
  $('hName').textContent = name;
  $('hStatus').textContent = channel === 'ig'
    ? (id.startsWith('@') ? id : '@' + id)
    : id;

  applyTheme(channel);
  $('chatArea').innerHTML = '';
  addSys(`Conectado como "${name}" vía ${channel === 'ig' ? 'Instagram' : 'WhatsApp'}`);
  bc.postMessage({ type:'sim_connect', channel, contactId:cId, contactName:cName });
  $('msgInput').focus();
}

function sendMsg() {
  if (!connected) return;
  const ta = $('msgInput');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  ta.style.height = '';
  $('btnSend').classList.remove('ready');
  addBubble('me', text);
  bc.postMessage({ type:'sim_message', channel, contactId:cId, contactName:cName, text, ts:Date.now() });
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function onInput(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 90) + 'px';
  $('btnSend').classList.toggle('ready', ta.value.trim().length > 0);
}

function addBubble(who, text, author) {
  const area = $('chatArea');
  const t = new Date().toLocaleTimeString('es', { hour:'2-digit', minute:'2-digit' });
  const d = document.createElement('div');
  d.className = `msg ${who}`;
  d.innerHTML = `<div class="bubble">${esc(text)}</div>`
    + `<div class="msg-time">${author ? author + ' · ' : ''}${t}</div>`;
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

function addSys(text) {
  const area = $('chatArea');
  const d = document.createElement('div');
  d.className = 'sys-line';
  d.textContent = text;
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

bc.addEventListener('message', e => {
  const d = e.data;
  if (d.type === 'crm_reply' && d.to === cId) {
    addBubble('them', d.text, d.author);
  }
});
</script>
</body>
</html>
